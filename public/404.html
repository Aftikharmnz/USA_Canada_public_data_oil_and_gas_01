<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening Energy Market Monitor…</title>
  </head>
  <body>
    <p>Opening Energy Market Monitor…</p>
    <script>
      (function () {
        var normalizedPath = window.location.pathname.replace(/\/index\.html\/?$/i, "/");
        var match = normalizedPath.match(
          /\/(usa\/profile|canada\/profile|usa-weekly|products|usa|canada|reference)\/?$/i
        );
        if (!match) return;

        var basePath = normalizedPath.slice(0, match.index + 1);
        var route = match[1].toLowerCase().replace("/", "-");
        try {
          window.sessionStorage.setItem("energy-market-monitor:route", route);
        } catch (_) {
          // Continue to the application root even when storage is unavailable.
        }
        window.location.replace(basePath + window.location.search + window.location.hash);
      })();
    </script>
  </body>
</html>
